    // Web Audio Synthesizer Class
    class AmbientEngine {
      constructor() {
        this.ctx = null;
        this.currentSound = null;
        this.gainNode = null;
        this.sourceNodes = [];
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.gainNode = this.ctx.createGain();
          this.gainNode.gain.value = 0.3;
          this.gainNode.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      stop() {
        this.sourceNodes.forEach(n => {
          try { n.stop(); n.disconnect(); } catch(e){}
        });
        this.sourceNodes = [];
        this.currentSound = null;
      }
      setVolume(val) {
        if (this.gainNode) {
          this.gainNode.gain.setValueAtTime(val, this.ctx.currentTime);
        }
      }
      play(soundType) {
        this.init();
        this.stop();
        this.currentSound = soundType;

        if (soundType === 'rain') {
          // Pink-filtered white noise buffer
          const bufferSize = this.ctx.sampleRate * 2;
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const whiteNoise = this.ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;
          whiteNoise.loop = true;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1000;

          whiteNoise.connect(filter);
          filter.connect(this.gainNode);
          whiteNoise.start();
          this.sourceNodes.push(whiteNoise);
        } else if (soundType === 'fireplace') {
          // Low drone + gentle crackle
          const osc = this.ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.value = 85;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 350;

          osc.connect(filter);
          filter.connect(this.gainNode);
          osc.start();
          this.sourceNodes.push(osc);
        } else if (soundType === 'library') {
          // Binaural calm focus drone
          const osc = this.ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = 108;
          osc.connect(this.gainNode);
          osc.start();
          this.sourceNodes.push(osc);
        }
      }
    }

                setIsCinemaPlaying(false);
                return durationSecs;
              }
              return next;
            });
          }

          // Sync subtitle and chapter
          const curT = cinemaTime;
          if (data.subtitles && data.subtitles.length > 0) {
            const curSub = data.subtitles.find(s => curT >= s.start && curT <= s.end);
            if (curSub && curSub.text !== currentSubtitleText) {
              setCurrentSubtitleText(curSub.text);
            }
          }
          if (scriptChapters.length > 0) {
            const chIdx = scriptChapters.findIndex(c => curT >= c.time_start && curT <= c.time_end);
            if (chIdx !== -1 && chIdx !== activeChapterIdx) {
              setActiveChapterIdx(chIdx);
            }
          }

          // Active chapter and scene
          const activeChIdx = scriptChapters.findIndex(c => curT >= c.time_start && curT <= c.time_end);
          const activeIdx = activeChIdx !== -1 ? activeChIdx : 0;
          const activeCh = scriptChapters[activeIdx] || {};
          const scIdx = scenesList.length > 0 ? (activeIdx % scenesList.length) : 0;
          const img = imgCache[scIdx];

          // 1. Dark canvas base
          ctx.fillStyle = '#05070a';
          ctx.fillRect(0, 0, 1280, 720);

          // 2. Draw scene image with smooth Ken Burns zoom & pan
          if (img && img.complete && img.naturalWidth > 0) {
            const zoom = 1.05 + 0.08 * Math.sin(curT * 0.12);
            const panX = Math.sin(curT * 0.08) * 35;
            const panY = Math.cos(curT * 0.06) * 20;

            ctx.save();
            ctx.translate(640 + panX, 360 + panY);
            ctx.scale(zoom, zoom);
            ctx.drawImage(img, -640, -360, 1280, 720);
            ctx.restore();
          } else {
            const grad = ctx.createLinearGradient(0, 0, 1280, 720);
            grad.addColorStop(0, '#111827');
            grad.addColorStop(0.5, '#0b0f14');
            grad.addColorStop(1, '#1e1b4b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1280, 720);
          }

          // 3. Cinematic Film Vignette
          const vig = ctx.createRadialGradient(640, 360, 280, 640, 360, 750);
          vig.addColorStop(0, 'rgba(0,0,0,0)');
          vig.addColorStop(0.7, 'rgba(0,0,0,0.45)');
          vig.addColorStop(1, 'rgba(0,0,0,0.85)');
          ctx.fillStyle = vig;
          ctx.fillRect(0, 0, 1280, 720);

          // 4. Gold dust particles
          particles.forEach(p => {
            p.x += p.speedX;
            p.y += p.speedY;
            if (p.y < 0) p.y = 720;
            if (p.x < 0) p.x = 1280;
            if (p.x > 1280) p.x = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(229, 184, 66, ' + (p.opacity * 0.7) + ')';
            ctx.fill();
          });

          // 5. Letterbox bars (2.39:1 Cinemascope)
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, 1280, 48);
          ctx.fillRect(0, 672, 1280, 48);

          ctx.fillStyle = 'rgba(229, 184, 66, 0.4)';
          ctx.fillRect(0, 48, 1280, 2);
          ctx.fillRect(0, 670, 1280, 2);

          // 6. Top Chapter HUD
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(30, 60, 560, 44);
          ctx.strokeStyle = 'rgba(229, 184, 66, 0.35)';
          ctx.strokeRect(30, 60, 560, 44);

          ctx.fillStyle = '#e5b842';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText('🔴 TIRIK KITOB • ' + (activeCh.title || 'Bob'), 45, 88);

          // Timecode
          const curM = Math.floor(curT / 60);
          const curS = Math.floor(curT % 60);
          const totM = Math.floor(durationSecs / 60);
          const totS = Math.floor(durationSecs % 60);
          const tc = curM + ':' + (curS < 10 ? '0' : '') + curS + ' / ' + totM + ':' + (totS < 10 ? '0' : '') + totS;
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 15px monospace';
          ctx.fillText(tc, 1120, 88);

          // 7. Subtitles in Lower Third of Canvas
          if (isSubtitlesOn) {
            const curSub = (data.subtitles || []).find(s => curT >= s.start && curT <= s.end);
            if (curSub && curSub.text) {
              ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
              ctx.fillRect(120, 580, 1040, 66);
              ctx.strokeStyle = 'rgba(229, 184, 66, 0.3)';
              ctx.strokeRect(120, 580, 1040, 66);

              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 19px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(curSub.text, 640, 622);
              ctx.textAlign = 'left';
            }
          }

          animId = requestAnimationFrame(render);
        };

        animId = requestAnimationFrame(render);

          const m = Math.floor(secs / 60);

        const handleVideoTimeUpdate = (e) => {
          const t = e.target.currentTime;
          setCurrentVideoTime(t);

          if (data.subtitles && data.subtitles.length > 0) {
            const curSub = data.subtitles.find(s => t >= s.start && t <= s.end);
            setCurrentSubtitleText(curSub ? curSub.text : '');
          }

          if (scriptChapters.length > 0) {
            const chIdx = scriptChapters.findIndex(c => t >= c.time_start && t <= c.time_end);

          <div className="fixed bottom-0 inset-x-0 z-40 bg-mutolaa-darkSurface/95 backdrop-blur-md border-t border-white/10 px-6 py-3.5 flex items-center justify-between shadow-2xl">
            <audio ref={audioRef} />

            <div className="flex items-center gap-3 min-w-0 max-w-xs">
              <img
                src={formatMediaUrl(activeAudioBook.cover_url || activeAudioBook.cover)}
                alt="Cover"
                className="w-11 h-11 rounded-lg object-cover shadow"
              />
              <div className="min-w-0">
                <div className="font-bold text-white text-xs line-clamp-1">{activeAudioBook.title}</div>
                <div className="text-[11px] text-gray-400 line-clamp-1">
                  {isSpeechMode ? (aiChapters[currentChapterIdx]?.title || "AI Tabiiy Ovoz") : activeAudioBook.author}
                </div>
              </div>
            </div>

            {/* Controls */}
            <div className="flex items-center gap-4">
              <button
                type="button"
                onClick={togglePlayPause}
                className="w-10 h-10 rounded-full bg-brand-500 text-white flex items-center justify-center hover:bg-brand-400 transition shadow-lg shadow-brand-500/25"
              >
                <Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5 fill-current" />
              </button>

              <button
                type="button"
                onClick={() => {
                  const rates = [0.75, 1, 1.25, 1.5, 2];
                  const nextIdx = (rates.indexOf(playbackRate) + 1) % rates.length;
                  setPlaybackRate(rates[nextIdx]);
                  if (audioRef.current) audioRef.current.playbackRate = rates[nextIdx];
                }}
                className="px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-[11px] font-mono text-gray-300 hover:text-white"
              >
                {playbackRate}x
              </button>

              <button
                type="button"
                onClick={stopAudio}
                className="p-2 rounded-lg text-gray-400 hover:text-white"
              >
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>
          </div>
        );
      };

      // --- MAIN RETURN JSX ---
      return (
        <div className="min-h-screen bg-[#0b0f14] text-gray-100 flex flex-col selection:bg-brand-500 selection:text-white">
          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-30 bg-[#0b0f14]/90 backdrop-blur-md border-b border-white/10 px-6 py-3.5">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              {/* Brand Logo */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveTab('home'); setSelectedGenre('all'); setSearchQuery(''); }}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-mutolaa-gold/80 p-0.5 shadow-lg shadow-brand-500/20">
                  <div className="w-full h-full bg-mutolaa-darkSurface rounded-xl flex items-center justify-center">
                    <span className="font-serif font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-mutolaa-gold">K</span>
                  </div>
                </div>
                <div>
                  <h1 className="font-serif font-black text-lg tracking-wider text-white">KAMOLOT</h1>
                  <p className="text-[10px] text-brand-400 font-medium -mt-1 tracking-widest uppercase">Aqlli Mutolaa</p>
                </div>
              </div>

              {/* Search Bar */}
              <div className="flex-1 max-w-md relative hidden md:block">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Kitob nomi, muallif yoki mavzu bo'yicha qidiruv..."
                  className="w-full pl-10 pr-4 py-2 rounded-xl bg-white/5 border border-white/10 text-white text-xs placeholder:text-gray-500 focus:outline-none focus:border-brand-500 transition"
                />
                <Icon name="search" className="w-4 h-4 text-gray-500 absolute left-3.5 top-2.5" />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-3 top-2.5 text-gray-500 hover:text-white text-xs">✕</button>
                )}
              </div>

              {/* Action Buttons & Profile */}
              <div className="flex items-center gap-2.5">
                {/* Kitob Olamiga Kirish Button */}
                <button
                  type="button"
                  onClick={() => {
                    const worldCandidate = books.find(b => /qodiriy|navoiy|odat|boy/i.test(b.title + b.author)) || books[0];
                    if (worldCandidate) openBookWorld(worldCandidate);
                  }}
                  className="hidden sm:flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-brand-500/20 to-mutolaa-gold/20 border border-brand-500/40 text-brand-300 text-xs font-semibold hover:border-brand-400 transition shadow-sm"
                >
                  <Icon name="compass" className="w-4 h-4 text-brand-400" />
                  <span>Olamga Kirish</span>
                </button>

                {/* AI Maslahatchi */}
                <button
                  type="button"
                  onClick={() => setShowAiAdvisor(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-gray-300 hover:text-white hover:border-brand-500/40 transition"
                >
                  <Icon name="sparkles" className="w-4 h-4 text-amber-400" />
                  <span className="hidden sm:inline">AI Maslahat</span>
                </button>

                {/* Imo-Ishora Tili */}
                <button
                  type="button"
                  onClick={() => setShowSignModal(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-gray-300 hover:text-white hover:border-brand-500/40 transition"
                >
                  <Icon name="hand" className="w-4 h-4 text-brand-400" />
                  <span className="hidden sm:inline">Imo-ishora</span>
                </button>

                {/* User Profile */}
                {currentUser ? (
                  <div className="flex items-center gap-2 pl-2 border-l border-white/10">
                    <img
                      src={currentUser.avatar || AVATARS[0]}
                      alt="User"
                      className="w-8 h-8 rounded-full object-cover border border-brand-500"
                    />
                    <div className="hidden lg:block text-left">
                      <div className="text-xs font-bold text-white line-clamp-1">{currentUser.first_name || currentUser.username}</div>
                      <div className="text-[10px] text-gray-400">@{currentUser.username}</div>
                    </div>
                    <button
                      type="button"
                      onClick={handleUserLogout}
                      title="Chiqish"
                      className="p-1.5 rounded-lg text-gray-500 hover:text-red-400 hover:bg-white/5 transition"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <button
                    type="button"
                    onClick={() => { setShowOnboarding(true); setOnboardingStep('auth'); }}
                    className="px-4 py-1.5 rounded-xl bg-brand-500 hover:bg-brand-400 text-white text-xs font-bold transition shadow-md shadow-brand-500/20"
                  >
                    Kirish
                  </button>
                )}

                {/* Admin Shortcut */}
                <a
                  href="/admin"
                  target="_blank"
                  rel="noreferrer"
                  className="p-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white transition"
                  title="Admin Panel"
                >
                  <Icon name="shield" className="w-4 h-4" />
                </a>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-6 py-6 space-y-8">
            {/* 1. HERO & "KITOB OLAMIGA KIRISH" PREMIUM VITRINA */}
            <div className="relative rounded-3xl overflow-hidden bg-gradient-to-r from-mutolaa-darkElevated via-mutolaa-darkSurface to-[#0a151b] border border-brand-500/30 p-8 shadow-2xl">
              <div className="absolute top-0 right-0 w-96 h-96 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>

              <div className="relative z-10 flex flex-col lg:flex-row items-center justify-between gap-8">
                <div className="max-w-xl space-y-4">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-500/20 text-brand-300 text-xs font-bold border border-brand-500/30">
                    <Icon name="sparkles" className="w-3.5 h-3.5" />
                    <span>KAMOLOT Ekotizimining Eng O'zgacha Imkoniyati</span>
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-serif font-black text-white tracking-wide leading-tight">
                    Kitob Olamiga Kirish — <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-mutolaa-gold">Immersiv Dunyo</span>
                  </h2>
                  <p className="text-gray-300 text-sm leading-relaxed">
                    Oddiy mutolaa bilan cheklanmang. Asarning tarixiy xaritalari, shahar va saroylariga qadamingizni bosing, qahramonlar munosabatlarini kashf eting va tabiat sukunatini jonli ovozlar (Web Audio) jo'rligida his qiling.
                  </p>
                  <div className="flex flex-wrap gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        const otkanKunlar = books.find(b => /otkan|o'tkan/i.test(b.title)) || books[0];
                        if (otkanKunlar) openBookWorld(otkanKunlar);
                      }}
                      className="px-6 py-3 rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 text-white font-bold text-xs hover:from-brand-500 hover:to-brand-400 transition shadow-lg shadow-brand-500/25 flex items-center gap-2"
                    >
                      <Icon name="compass" className="w-4 h-4" />
                      <span>O'tkan Kunlar Olamiga Sayohat</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => setShowAiAdvisor(true)}
                      className="px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white font-bold text-xs transition flex items-center gap-2"
                    >
                      <Icon name="sparkles" className="w-4 h-4 text-amber-400" />
                      <span>AI Tavsiya So'rash</span>
                    </button>
                  </div>
                </div>

                {/* Vitrina Cards Showcase */}
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 w-full lg:w-auto">
                  {books.slice(0, 3).map((b, i) => (
                    <div
                      key={i}
                      onClick={() => openBookWorld(b)}
                      className="group cursor-pointer p-2.5 rounded-2xl bg-black/40 border border-white/10 hover:border-brand-500/50 transition flex flex-col items-center text-center space-y-2 w-36"
                    >
                      <img
                        src={formatMediaUrl(b.cover_url || b.cover)}
                        alt={b.title}
                        className="w-24 h-32 object-cover rounded-xl shadow-md group-hover:scale-105 transition"
                      />
                      <div className="font-bold text-white text-xs line-clamp-1 w-full">{b.title}</div>
                      <span className="text-[10px] text-brand-400 font-semibold group-hover:underline">Olamga Kirish →</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* 2. CATEGORIES & FORMAT FILTERS */}
            <div className="space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                {/* Format Filter Tabs */}
                <div className="flex bg-white/5 p-1 rounded-2xl border border-white/10 w-fit">
                  {[
                    { id: 'all', label: "Barcha kitoblar" },
                    { id: 'pdf', label: "PDF kitoblar" },
                    { id: 'audio', label: "AI Audiokitoblar" },
                    { id: 'free', label: "Erkin mutolaa" }
                  ].map(f => (
                    <button
                      key={f.id}
                      type="button"
                      onClick={() => setFormatFilter(f.id)}
                      className={"px-4 py-2 rounded-xl text-xs font-bold transition " + (formatFilter === f.id ? "bg-brand-500 text-white shadow-md shadow-brand-500/20" : "text-gray-400 hover:text-white")}
                    >
                      {f.label}
                    </button>
                  ))}
                </div>

                {/* Stats badge */}
                <div className="text-xs text-gray-400 font-medium">
                  Katalogda jami: <b className="text-white">{filteredBooks.length}</b> ta asar mavjud
                </div>
              </div>

              {/* Genre Chips Carousel */}
              <div className="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                {[
                  { slug: 'all', name: "Barchasi" },
                  { slug: 'fiction', name: "Badiiy adabiyot" },
                  { slug: 'history', name: "Tarix" },
                  { slug: 'science', name: "Ilm-fan" },
                  { slug: 'psychology', name: "Psixologiya" },
                  { slug: 'fiction_sci', name: "Fantastika" },
                  { slug: 'business', name: "Biznes" },
                  { slug: 'selfdev', name: "Shaxsiy rivojlanish" },
                  { slug: 'poetry', name: "She'riyat" },
                  { slug: 'children', name: "Bolalar" }
                ].map(g => (
                  <button
                    key={g.slug}
                    type="button"
                    onClick={() => setSelectedGenre(g.slug)}
                    className={"px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap border transition " + (selectedGenre === g.slug ? "bg-brand-500 border-brand-500 text-white shadow-sm" : "bg-white/5 border-white/10 text-gray-400 hover:text-white hover:border-white/20")}
                  >
                    {g.name}
                  </button>
                ))}
              </div>
            </div>

            {/* 3. BOOK CATALOG GRID */}
            <div className="space-y-4">
              <h3 className="font-serif font-bold text-xl text-white">Mutolaa Maydoni</h3>

              {filteredBooks.length === 0 ? (
                <div className="text-center py-20 bg-white/5 rounded-3xl border border-white/10 space-y-3">
                  <Icon name="book" className="w-10 h-10 text-gray-500 mx-auto" />
                  <div className="text-sm font-semibold text-gray-300">Hech qanday kitob topilmadi</div>
                  <p className="text-xs text-gray-500">Qidiruv so'zini o'zgartirib ko'ring yoki filtrlarni tozalang.</p>
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
                  {filteredBooks.map((b) => {
                    const isSaved = savedBookIds.includes(b.id);
                    const coverSrc = formatMediaUrl(b.cover_url || b.cover) || "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600";

                    return (
                      <div
                        key={b.id}
                        className="book-card group relative bg-mutolaa-darkSurface border border-white/10 hover:border-brand-500/40 rounded-2xl p-3.5 flex flex-col justify-between transition-all duration-300 hover:shadow-xl"
                      >
                        {/* Bookmark Button */}
                        <button
                          type="button"
                          onClick={(e) => toggleSaveBook(b.id, e)}
                          className={"absolute top-5 right-5 z-20 p-2 rounded-xl backdrop-blur-md transition " + (isSaved ? "bg-brand-500 text-white shadow-lg" : "bg-black/50 text-gray-400 hover:text-white")}
                          title={isSaved ? "Saqlanganlardan o'chirish" : "Saqlash"}
                        >
                          <Icon name="bookmark" className="w-3.5 h-3.5 fill-current" />
                        </button>

                        {/* Cover Image with 3D spine */}
                        <div
                          className="cursor-pointer relative overflow-hidden rounded-xl aspect-[2/3] bg-neutral-900 mb-3"
                          onClick={() => setReadingBook(b)}
                        >
                          <img
                            src={coverSrc}
                            alt={b.title}
                            className="w-full h-full object-cover book-spine-3d"
                            loading="lazy"
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition flex items-end p-3">
                            <span className="text-[11px] font-bold text-white bg-brand-500 px-3 py-1 rounded-lg shadow">
                              Mutolaa qilish →
                            </span>
                          </div>
                        </div>

                        {/* Book Metadata */}
                        <div className="space-y-1.5 flex-1">
                          <div className="flex items-center justify-between text-[10px] text-gray-400">
                            <span className="font-semibold text-brand-400">{b.genre_name || "Adabiyot"}</span>
                            <span>{b.year || '2024'}</span>
                          </div>
                          <h4
                            onClick={() => setReadingBook(b)}
                            className="font-serif font-bold text-sm text-white line-clamp-1 cursor-pointer group-hover:text-brand-300 transition"
                            title={b.title}
                          >
                            {b.title}
                          </h4>
                          <p className="text-xs text-gray-400 line-clamp-1">{b.author}</p>
                        </div>

                        {/* Action Buttons Row */}
                        <div className="pt-2.5 border-t border-white/5 space-y-1.5 mt-2.5">
                          {/* Tirik Kitob Prominent Button */}
                          <button
                            type="button"
                            onClick={() => openBookWorld(b)}
                            className="w-full py-1.5 px-3 rounded-xl bg-gradient-to-r from-amber-500/20 via-brand-500/20 to-brand-500/10 hover:from-amber-500/30 hover:to-brand-500/30 border border-amber-500/30 text-amber-300 hover:text-white text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm"
                            title="Tirik Kitob — 8-10 min video, sahnalar va kitob olami"
                          >
                            <Icon name="sparkles" className="w-3.5 h-3.5 text-amber-400" />
                            <span>🎬 Tirik kitob — videoda ko'rish</span>
                          </button>

                          <div className="grid grid-cols-3 gap-1.5">
                            <button
                              type="button"
                              onClick={() => setReadingBook(b)}
                              className="py-1.5 rounded-lg bg-white/5 hover:bg-brand-500 hover:text-white text-gray-300 text-[11px] font-semibold transition flex items-center justify-center gap-1"
                              title="Kitobni o'qish (PDF/Matn)"
                            >
                              <Icon name="book" className="w-3 h-3" />
                              <span>O'qish</span>
                            </button>

                            <button
                              type="button"
                              onClick={() => playAudioBook(b)}
                              className="py-1.5 rounded-lg bg-white/5 hover:bg-amber-500 hover:text-white text-gray-300 text-[11px] font-semibold transition flex items-center justify-center gap-1"
                              title="AI Audiokitob tinglash"
                            >
                              <Icon name="headphones" className="w-3 h-3" />
                              <span>Audio</span>
                            </button>

                            <button
                              type="button"
                              onClick={() => openDiscussions(b)}
                              className="py-1.5 rounded-lg bg-white/5 hover:bg-white/15 text-gray-300 text-[11px] font-semibold transition flex items-center justify-center gap-1"
                              title="Fikrlar va muhokama"
                            >
                              <Icon name="messageSquare" className="w-3 h-3" />
                              <span>Fikr</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </main>

          {/* FOOTER */}
          <footer className="mt-16 border-t border-white/10 bg-mutolaa-darkSurface/50 px-6 py-8 text-center text-xs text-gray-500 space-y-2">
            <div className="font-serif font-bold text-gray-400 text-sm">KAMOLOT — Aqlli Mutolaa va Audiokitoblar Ekotizimi</div>
            <p>Qonuniy va erkin ochiq manbalar asosida ishlaydi: archive.org • gutenberg.org • openlibrary.org • natlib.uz</p>
            <p className="text-[11px] text-gray-600">© 2024-2026 KAMOLOT. Barcha huquqlar himoyalangan.</p>
          </footer>

          {/* RENDER MODALS */}
          {renderOnboardingModal()}
          {renderReaderModal()}
          {renderWorldModal()}
          {renderDiscussionsModal()}
          {renderAiAdvisor()}
          {renderSignModal()}
          {renderAudioPlayerBar()}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<KamolotApp />);
  </script>
</body>
</html>
